name: Build GestaltX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project GestaltX.xcodeproj \
            -scheme GestaltX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GestaltX.app Payload/
          zip -r GestaltX-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GestaltX-unsigned
          path: GestaltX-unsigned.ipa
